[project]
name = "nova-act-qa-e2e-test"
version = "0.1.0"
requires-python = ">= 3.13"
dependencies = [
    "nova-act",
    "pytest"
]

[build-system]
requires = ["setuptools==80.9", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
